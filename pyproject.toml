[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptanalyzer"
version = "0.1.0"
description = "Local-first LLM observability & prompt versioning. Git for prompts — one decorator, zero config."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Syed Obaidullah Hassan Chishti" }]
keywords = [
    "llm", "observability", "prompt", "versioning", "openai", "anthropic",
    "tracing", "logging", "monitoring", "ai", "gpt", "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
postgres = ["psycopg2-binary>=2.9"]
migrations = ["alembic>=1.13"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
all = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
]

[project.urls]
Homepage = "https://github.com/obaidhsn/promptanalyzer"
Documentation = "https://github.com/obaidhsn/promptanalyzer#readme"
Repository = "https://github.com/obaidhsn/promptanalyzer"
Issues = "https://github.com/obaidhsn/promptanalyzer/issues"
Changelog = "https://github.com/obaidhsn/promptanalyzer/blob/main/CHANGELOG.md"

[project.scripts]
promptanalyzer = "promptanalyzer.cli:main"
pa = "promptanalyzer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["promptanalyzer"]
# Templates, static assets, py.typed and migrations live inside the package and
# are included automatically by hatchling's default file selection.

[tool.hatch.build.targets.sdist]
include = ["promptanalyzer", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

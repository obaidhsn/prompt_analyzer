name: 🐛 Bug report
description: Report a problem with PromptAnalyzer
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to file a bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: The smallest code snippet that reproduces the issue.
      render: python
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Environment
      description: Output of `promptanalyzer doctor`.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PromptAnalyzer version
      placeholder: "0.1.0"
    validations:
      required: true

# Alembic configuration for PromptAnalyzer (optional — the default `migrate`
# command uses SQLAlchemy create_all; Alembic is provided for advanced/Postgres
# workflows). The database URL is resolved at runtime from PROMPTANALYZER_* env
# vars in migrations/env.py, so no URL is hard-coded here.

[alembic]
script_location = promptanalyzer/migrations
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
